name: Catalogue family shopfront
on:
  pull_request:
    paths:
      - 'app.js'
      - 'current/manifest.json'
      - 'current/behaviour/shopfront-family-banner.js'
      - 'current/styles/shopfront-family-banner.css'
      - 'tests/shopfront-family-banner*'
      - '.github/workflows/family-shopfront.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/shopfront-family-banner.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/shopfront-family-banner-browser.mjs
      - run: node tests/master-navigation-browser.mjs
