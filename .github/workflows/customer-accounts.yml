name: Customer accounts and mailbox
on:
  pull_request:
    paths:
      - 'app.js'
      - 'current/behaviour/customer-*.js'
      - 'current/behaviour/mail-workspace.js'
      - 'current/behaviour/direct-correspondence.js'
      - 'current/behaviour/procurement-mail.js'
      - 'current/behaviour/onboarding.js'
      - 'tests/unified-email-browser.mjs'
      - 'tests/portal-layout-regression.mjs'
      - 'tests/control-alignment-browser.mjs'
      - 'current/styles/control-alignment.css'
      - 'current/styles/catalogue-photo-standard.css'
      - 'current/behaviour/catalogue-image-policy.js'
      - 'current/behaviour/variant-photographs*.js'
      - 'data/variant-photographs.json'
      - 'tools/build-variant-photographs.mjs'
      - 'tests/variant-photographs*.mjs'
      - 'tests/catalogue-photo-standard-browser.mjs'
      - 'tests/catalogue-photo-upload-browser.mjs'
      - 'tests/workshop-layout-browser.mjs'
      - 'current/styles/workshop-refinement.css'
      - 'current/styles/catalogue-category-titles.css'
      - 'current/behaviour/workstation.js'
      - 'current/behaviour/business-workspace-model.js'
      - 'current/styles/operating-system.css'
      - 'tests/business-workspace*'
      - 'current/manifest.json'
      - 'supabase/**'
      - 'tests/customer-*.mjs'
      - 'tests/gmail-security.mjs'
      - 'package*.json'
      - '.github/workflows/customer-accounts.yml'
jobs:
  isolated-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:customer-accounts
      - run: npm run test:mail-safety
      - run: node tests/email-schedules-rls.mjs
      - run: node tests/email-schedules-functions.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:customer-accounts-browser
      - run: node --test tests/business-workspace-model.test.cjs
      - run: node tests/business-workspace-browser.mjs
      - run: node tests/unified-email-browser.mjs
      - run: node tests/email-send-feedback-browser.mjs
      - run: node tests/portal-layout-regression.mjs
      - run: node tests/control-alignment-browser.mjs
      - run: node tests/workshop-layout-browser.mjs
      - run: node tests/catalogue-image-policy.test.mjs
      - run: node tests/catalogue-photo-standard-browser.mjs
      - run: node tests/sports-photographs-browser.mjs
      - run: node tests/variant-photographs.mjs
      - run: node tests/variant-photographs-browser.mjs
      - run: node tests/catalogue-photo-upload-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-account-browser-evidence
          path: |
            test-results/variant-photographs/
            test-results/customer-accounts
            test-results/business-workspace
            test-results/unified-email
            test-results/email-feedback
            test-results/photo-standard
            test-results/sports-photos
            test-results/control-alignment
            test-results/portal-layout
            test-results/workshop-layout
