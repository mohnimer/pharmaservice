name: Workshop and PS Report Card
on:
  pull_request:
    paths:
      - 'app.js'
      - 'current/workshop/**'
      - 'current/manifest.json'
      - 'supabase/migrations/*workshop*'
      - 'supabase/functions/workshop-notifications/**'
      - 'tests/workshop-*'
      - 'tools/build-workshop-mappings.mjs'
      - '.github/workflows/workshop-report-card.yml'
jobs:
  persistent-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node tests/workshop-backend.mjs
      - run: node tests/workshop-dom.mjs\n      - run: node tests/workshop-persistence.mjs
      - run: npm run test:dom
      - run: npx playwright install --with-deps chromium
      - run: node tests/workshop-browser.mjs
      - run: node tests/workshop-layout-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-report-card-review
          path: test-results/
          retention-days: 14
