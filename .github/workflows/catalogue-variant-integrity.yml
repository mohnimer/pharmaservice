name: Catalogue variant integrity
on:
  push:
    branches: [catalogue-evidence-repair-20261010]
  pull_request:
    paths:
      - 'current/behaviour/variant-evidence.js'
      - 'current/behaviour/family-details.js'
      - 'tests/variant-evidence.test.cjs'
      - 'current/manifest.json'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/variant-evidence.test.cjs
      - run: npm test
      - run: npm run build
