name: Professional catalogue experience
on:
  pull_request:
    paths:
      - 'app.js'
      - 'styles.css'
      - 'current/behaviour/family-details.js'
      - 'current/behaviour/product-presentation.js'
      - 'current/behaviour/storefront-*.js'
      - 'current/behaviour/photo-subject*.js'
      - 'current/behaviour/catalogue-image-*.js'
      - 'tests/catalogue-image-release-browser.mjs'
      - 'current/styles/**'
      - 'current/behaviour/interaction-feedback.js'
      - 'current/manifest.json'
      - 'tests/professional-*.mjs'
      - 'tests/ready-baskets.mjs'
      - 'current/behaviour/ready-baskets*.js'
      - 'current/behaviour/school-baskets.js'
      - 'tests/school-baskets*.mjs'
      - 'current/behaviour/home-layout.js'
      - 'current/behaviour/model-story.js'
      - 'tests/how-we-work-browser.mjs'
      - 'tests/workshop-articles-browser.mjs'
      - 'workshop-data.js'
      - 'tests/catalogue-enquiry-context.mjs'
      - 'tests/intelligent-search-browser.mjs'
      - 'tests/search-acceptance-browser.mjs'
      - 'tests/operating-journey-browser.mjs'
      - 'tests/account-continuity-browser.mjs'
      - '.github/workflows/professional-catalogue.yml'
jobs:
  request-and-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node tests/professional-category-grid-browser.mjs
      - run: node tests/professional-disclosures-browser.mjs
      - run: node tests/professional-navigation-browser.mjs
      - run: node tests/catalogue-enquiry-context.mjs
      - run: node tests/search-acceptance-browser.mjs
      - run: node tests/intelligent-search-browser.mjs
      - run: node tests/operating-journey-browser.mjs
      - run: node tests/account-continuity-browser.mjs
      - run: node --test tests/variant-evidence.test.cjs tests/catalogue-stock.test.cjs tests/catalogue-refresh-identity.test.cjs tests/intelligent-search.test.mjs
      - run: node --test tests/storefront-groups.test.cjs
      - run: node tests/storefront-groups-browser.mjs
      - run: node tests/professional-wishlist.mjs
      - run: node tests/professional-catalogue.mjs
      - run: node tests/professional-submission.mjs
      - run: node tests/ready-baskets.mjs
      - run: node tests/school-baskets-browser.mjs
      - run: node tests/professional-experience-browser.mjs
      - run: node tests/how-we-work-browser.mjs
      - run: node tests/workshop-articles-browser.mjs
      - run: node tests/portal-home-journey-browser.mjs
      - run: node tests/portal-layout-regression.mjs
      - run: npm run test:dom
      - run: npm run test:catalogue
      - run: node tests/reference-overlay.mjs
      - run: node tests/professional-cohesion-browser.mjs
      - run: node tests/professional-motion-browser.mjs
      - run: node tests/variant-browser.mjs
      - run: node tests/catalogue-photo-standard-browser.mjs
      - run: node --test tests/photo-subject-fit.test.cjs
      - run: node tests/catalogue-image-release-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: professional-catalogue-review
          path: test-results/
          retention-days: 14
